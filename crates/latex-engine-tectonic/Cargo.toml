[package]
name = "latex-engine-tectonic"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }
latex-model = { path = "../latex-model" }
tectonic = "0.17"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
