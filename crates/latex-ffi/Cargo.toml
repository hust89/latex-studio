[package]
name = "latex-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
latex-build = { path = "../latex-build" }
latex-correct = { path = "../latex-correct" }
latex-engine-tectonic = { path = "../latex-engine-tectonic" }
latex-formal = { path = "../latex-formal" }
latex-model = { path = "../latex-model" }
latex-project = { path = "../latex-project" }
latex-publish = { path = "../latex-publish" }
latex-verify = { path = "../latex-verify" }

[dev-dependencies]
tempfile = "3"
zip = "2"
